# release-plz feeds cargo-semver-checks the HIGHEST version on crates.io as
# the baseline, yanked or not (release-plz/release-plz#524: cargo cannot
# report yank status). oxideav-core has a yanked 0.2.0 (2026-05-01) above the
# live 0.1.x line, so from release-plz 0.3.163 on every release PR compared
# master against that stale May tree and proposed 0.2.0 with phantom breaking
# changes (PR #41 and its predecessors were hand-edited back to 0.1.x).
#
# The semver gate lives in CI instead: the `semver` job in
# .github/workflows/ci.yml runs cargo-semver-checks directly, which resolves
# the baseline itself and skips yanked versions. Drop this override once
# release-plz learns to skip yanked versions (or the 0.1.x line is left).
[[package]]
name = "oxideav-core"
semver_check = false
