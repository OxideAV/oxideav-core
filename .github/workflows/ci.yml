name: CI

# Thin shim around the OxideAV org-level reusable workflow. See
# https://github.com/OxideAV/.github for the actual job definitions and
# the input surface. Miri is manual-only (workflow_dispatch); trigger
# it from the Actions UI when arena code changes (PR #12, Shnatsel,
# 2026-05).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit

  # API-compatibility gate. release-plz's own semver check is disabled for
  # this crate (see release-plz.toml): it compares against the highest
  # crates.io version including the yanked 0.2.0. cargo-semver-checks run
  # directly resolves the baseline to the latest NON-yanked release, so a
  # breaking change on the 0.1.x line fails here instead of surfacing as a
  # phantom 0.2.0 release proposal.
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2
